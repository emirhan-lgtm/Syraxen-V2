server {
    listen 80;
    server_name syraxen.tr www.syraxen.tr;
    root /var/www/syraxen;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 30d;
    }
}
# HTTPS için:  sudo certbot --nginx -d syraxen.tr -d www.syraxen.tr
